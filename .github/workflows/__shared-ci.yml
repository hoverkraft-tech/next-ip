---
name: Shared - Validate and package

on:
  workflow_call:
    inputs:
      release-tag:
        description: Planned release tag; empty builds snapshot archives
        type: string
    outputs:
      artifact-id:
        description: Validated release archives and checksums
        value: ${{ jobs.build.outputs.artifact-id }}

permissions: {}

jobs:
  lint:
    name: Repository quality
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@af0bdd6313bd49aaf4a8a7f0de005fb0db856b03 # 4.3.3
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
    with:
      comment: false
      lint-all: true
      # GO_MODULES runs the full linter recursively; standalone-file mode cannot span packages.
      linter-env: |
        VALIDATE_GO=false
        GOTOOLCHAIN=local
        IGNORE_GITIGNORED_FILES=true
        LOG_LEVEL=INFO

  test:
    name: Go Continuous Integration
    uses: hoverkraft-tech/ci-github-go/.github/workflows/continuous-integration.yml@dcc9e10f1938e4496a40edc4e90eb0a6294a8bb2 # 0.0.1
    permissions:
      contents: read
      id-token: write
    with:
      go-versions: '["1.26", "1.27"]'

  build:
    needs: [lint, test]
    # TODO: Replace this candidate pin with a released SHA after https://github.com/hoverkraft-tech/ci-github-go/pull/13
    uses: hoverkraft-tech/ci-github-go/.github/workflows/build-release.yml@2db38ba3c9d23770c04b71866551231470cd2994 # PR #13 (unreleased)
    permissions:
      contents: read
    with:
      go-version: "1.27"
      tag: ${{ inputs.release-tag }}

  reports:
    if: ${{ !cancelled() }}
    needs: [lint, test]
    uses: hoverkraft-tech/ci-github-common/.github/workflows/ci-reports.yml@af0bdd6313bd49aaf4a8a7f0de005fb0db856b03 # 4.3.3
    permissions:
      contents: read
      pull-requests: write
    with:
      job-results: ${{ toJSON(needs) }}
